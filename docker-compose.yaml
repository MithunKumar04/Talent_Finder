version: "3.9"

services:
  backend:
    build:
      context: ./Backend
    container_name: backend
    ports:
      - "8001:8000"
    volumes:
      - ./Backend:/app
    environment:
      - PYTHONUNBUFFERED=1

  frontend:
    build:
      context: ./Frontend
    container_name: Frontend
    ports:
      - "3000:80"
    depends_on:
      - backend